name: Data Engineer Assessment

on:
  pull_request:
    branches:
      - master # Could be main or solution-samyar-farjam

jobs:
  assessment:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@ee0669bd1cc54295c223e0bb666b733df41de1c5 # v2.7.0

      - name: Set up Python
        uses: actions/setup-python@e9aba2c848f5ebd159c070c61ea2c4e2b122355e # v2.3.4
        with:
          python-version: "3.8"

      - name: Setup System and Install Dependencies
        run: |
          sudo apt-get update
          pip install -r requirements.txt

      - name: Set up MySQL
        run: |
          sudo apt-get install mysql-connector-python mysql-connector pandas
